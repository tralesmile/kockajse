name: Daily ticket

on:
  schedule:
    # 08:00 Skopje time. Two entries cover summer (UTC+2) and winter (UTC+1); the script
    # skips the run that is too early or a repeat. Gemini's free daily quota resets at
    # 00:00 UTC, well before this.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, even if today's email was already sent"
        type: boolean
        default: false
      resend:
        description: "Only resend the email for the open ticket (no new ticket)"
        type: boolean
        default: false
      preview:
        description: "Pick and email a test ticket without saving it"
        type: boolean
        default: false
      diagnose:
        description: "Only check which Gemini models each key can use"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-ticket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Settle, pick and email
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py ${{ inputs.force && '--force' || '' }} ${{ inputs.resend && '--resend' || '' }} ${{ inputs.preview && '--preview' || '' }} ${{ inputs.diagnose && '--diagnose' || '' }}
      - name: Save the ledger
        run: |
          git config user.name "betting-bot"
          git config user.email "betting-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update ledger"
          git push
