name: Daily ticket

on:
  schedule:
    # Around 08:00 Skopje time. GitHub often runs scheduled jobs late or skips them, so
    # there are several backup times; the script only acts on the first one after 08:00
    # local time each day and ignores the rest. Off-the-hour minutes are less congested.
    - cron: "17 6 * * *"
    - cron: "47 6 * * *"
    - cron: "17 7 * * *"
    - cron: "47 7 * * *"
    - cron: "23 8 * * *"
    - cron: "53 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, even if today's email was already sent"
        type: boolean
        default: false
      resend:
        description: "Only resend the email for the open ticket (no new ticket)"
        type: boolean
        default: false
      preview:
        description: "Pick and email a test ticket without saving it"
        type: boolean
        default: false
      diagnose:
        description: "Only check which Gemini models each key can use"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-ticket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Settle, pick and email
        id: bot
        env:
          GH_TOKEN: ${{ github.token }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py ${{ inputs.force && '--force' || '' }} ${{ inputs.resend && '--resend' || '' }} ${{ inputs.preview && '--preview' || '' }} ${{ inputs.diagnose && '--diagnose' || '' }}
      - name: Save the ledger
        run: |
          git config user.name "betting-bot"
          git config user.email "betting-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update ledger"
          # The closing watcher commits to main at the same time. Data files are merged
          # row by row (merge_data.py), and the push is retried: a failed save here once
          # lost the day's ticket after its email had gone out, and the next run picked
          # a second one (9 Nov 2026).
          git config merge.botdata.driver "python merge_data.py %O %A %B %P"
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Save attempt $i failed; retrying."
            sleep $((10 * i))
          done
          exit 1
      - name: Start the closing-price watcher
        # Starts the self-continuing closing watcher (closing.yml) once today's bets are
        # logged. GitHub's own schedule for it runs only a few times a day.
        if: ${{ steps.bot.outputs.made == 'yes' && !inputs.preview && !inputs.diagnose && !inputs.resend }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python bot.py --closing-chain)" = "yes" ]; then
            gh workflow run closing.yml --ref "${GITHUB_REF_NAME}" -f chain=1 \
              && echo "Closing watcher started." || echo "Could not start the closing watcher."
          else
            echo "Nothing to watch."
          fi
